<script>
(function () {
  // 개인 데이터(로그인 정보, 즐겨찾기)는 기기별로 달라도 되므로 그대로 localStorage 사용
  function prefixed(key, shared) {
    return (shared ? "bogopass_shared_" : "bogopass_local_") + key;
  }
  window.storage = {
    async get(key, shared) {
      const raw = localStorage.getItem(prefixed(key, shared));
      if (raw === null) throw new Error("not found");
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared) {
      try {
        localStorage.setItem(prefixed(key, shared), value);
        return { key, value, shared: !!shared };
      } catch (e) {
        console.error("storage set failed", e);
        return null;
      }
    },
    async delete(key, shared) {
      try {
        localStorage.removeItem(prefixed(key, shared));
        return { key, deleted: true, shared: !!shared };
      } catch (e) {
        return null;
      }
    },
    async list(prefix, shared) {
      const p = prefixed(prefix || "", shared);
      const keys = Object.keys(localStorage).filter((k) => k.startsWith(p));
      return { keys, prefix, shared: !!shared };
    },
  };
})();
</script>

  m.textContent = '앱 실행 중 오류가 발생했어요: ' + (err && err.message ? err.message : String(err)) + ' — 개발자 도구(F12)의 Console 탭에서 자세한 내용을 확인할 수 있어요.';
  el.className = 'show';
}
</script>
</body>
</html>
